
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d18">
  <title>مشاهدة المباراة | Koora Live</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    body { background:#080d18; color:#fff; margin:0; }
    .watch-page { max-width:1100px; margin:auto; padding:25px 15px; }
    .watch-top { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:30px; }
    .watch-top a { color:#fff; text-decoration:none; }
    .watch-actions { display:flex; gap:10px; }
    .watch-actions button,.source-btn {
      border:1px solid #344158; background:#172235; color:white;
      padding:12px 18px; border-radius:12px; cursor:pointer;
    }
    .match-heading { text-align:center; margin:30px 0; }
    .match-heading h1 { font-size:25px; }
    .match-heading p { color:#b8c3d5; }
    .video-box { background:#000; border:1px solid #26354d; border-radius:18px; overflow:hidden; }
    #videoPlayer { width:100%; aspect-ratio:16/9; display:block; background:#000; }
    .player-message { display:none; padding:15px; color:#cbd5e1; text-align:center; }
    .sources { margin-top:25px; background:#111b2b; padding:22px; border-radius:18px; }
    .sources h2 { font-size:22px; margin-top:0; }
    #sourceList { display:flex; flex-wrap:wrap; gap:12px; }
    .source-btn { background:#172235; min-width:145px; }
    .source-btn.active { background:#087f5b; border-color:#16a879; }
    .empty { color:#aab8cc; }
    @media(max-width:600px) {
      .watch-top { flex-direction:column; align-items:stretch; }
      .watch-actions button { flex:1; }
      .watch-actions { width:100%; }
    }
  </style>
</head>

<body>
<main class="watch-page">

  <header class="watch-top">
    <a href="index.html">← العودة إلى المباريات</a>
    <div class="watch-actions">
      <button onclick="location.reload()">⟳ تحديث</button>
      <button onclick="shareMatch()">↗ مشاركة</button>
    </div>
  </header>

  <section class="match-heading">
    <h1 id="matchTitle">مشاهدة المباراة</h1>
    <p id="matchInfo">Koora Live</p>
  </section>

  <section class="video-box">
    <video id="videoPlayer" controls playsinline preload="metadata"></video>
    <div class="player-message" id="playerMessage"></div>
  </section>

  <section class="sources">
    <h2>مصادر المشاهدة</h2>
    <div id="sourceList">
      <p class="empty">جاري تحميل المصادر...</p>
    </div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script src="config.js"></script>

<script>
const API = (window.KOORA_CONFIG?.apiBaseUrl || "").replace(/\/$/, "");
const params = new URLSearchParams(location.search);
const streamId = params.get("id");

const player = document.getElementById("videoPlayer");
const message = document.getElementById("playerMessage");
const sourceList = document.getElementById("sourceList");

let hlsInstance = null;
let matchStreams = [];

function showMessage(text) {
  message.textContent = text;
  message.style.display = "block";
}

function hideMessage() {
  message.textContent = "";
  message.style.display = "none";
}

player.addEventListener("playing", hideMessage);

player.addEventListener("error", () => {
  showMessage("تعذر تشغيل هذا المصدر. تحقق من الرابط.");
});

function normalizeName(value) {
  return String(value || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9\u0600-\u06FF]/g, "");
}

function sameMatch(a, b) {
  const ah = normalizeName(a.home_team);
  const aa = normalizeName(a.away_team);
  const bh = normalizeName(b.home_team);
  const ba = normalizeName(b.away_team);

  const teamsMatch =
    (ah === bh && aa === ba) ||
    (ah === ba && aa === bh);

  const ac = normalizeName(a.competition);
  const bc = normalizeName(b.competition);

  return teamsMatch && (!ac || !bc || ac === bc);
}

async function loadSources() {
  if (!streamId || !API) {
    sourceList.innerHTML = '<p class="empty">رابط المباراة غير صالح.</p>';
    return;
  }

  try {
    const response = await fetch(`${API}/api/streams`, {
      cache:"no-store"
    });

    if (!response.ok) throw new Error("تعذر تحميل المصادر");

    const result = await response.json();

    const streams = Array.isArray(result)
      ? result
      : (result.streams || []);

    const selected = streams.find(
      item => String(item.id) === String(streamId)
    );

    if (!selected) {
      sourceList.innerHTML = '<p class="empty">المباراة غير موجودة.</p>';
      return;
    }

    // جميع المصادر التي تخص المباراة نفسها
    matchStreams = streams.filter(item => sameMatch(item, selected));

    document.getElementById("matchTitle").textContent =
      `${selected.home_team || ""} × ${selected.away_team || ""}`;

    document.getElementById("matchInfo").textContent =
      selected.competition || "Koora Live";

    renderSourceButtons();

  } catch (error) {
    console.error(error);
    sourceList.innerHTML =
      '<p class="empty">تعذر الاتصال بالخادم. حاول التحديث.</p>';
  }
}

function renderSourceButtons() {
  sourceList.innerHTML = "";

  if (!matchStreams.length) {
    sourceList.innerHTML =
      '<p class="empty">لا توجد مصادر لهذه المباراة.</p>';
    return;
  }

  matchStreams.forEach((item, index) => {
    const button = document.createElement("button");

    button.className = "source-btn";
    button.textContent = item.channel || `المصدر ${index + 1}`;

    button.addEventListener("click", () => {
      playSource(item.id, button);
    });

    sourceList.appendChild(button);
  });
}

async function playSource(id, button) {
  try {
    showMessage("جاري تحميل البث...");

    if (hlsInstance) {
      hlsInstance.destroy();
      hlsInstance = null;
    }

    player.pause();
    player.removeAttribute("src");
    player.load();

    const response = await fetch(
      `${API}/api/streams/${encodeURIComponent(id)}`,
      {cache:"no-store"}
    );

    if (!response.ok) throw new Error("تعذر جلب رابط البث");

    const data = await response.json();
    const url = data.stream_url || data.url;

    if (!url) throw new Error("رابط البث غير متوفر");

    const parsed = new URL(url);

    if (!["http:", "https:"].includes(parsed.protocol)) {
      throw new Error("رابط الفيديو غير صالح");
    }

    document.querySelectorAll(".source-btn").forEach(btn => {
      btn.classList.remove("active");
    });

    button.classList.add("active");

    const isHls = /\.m3u8($|\?)/i.test(
      parsed.pathname + parsed.search
    );

    if (isHls && player.canPlayType("application/vnd.apple.mpegurl")) {
      player.src = url;
      player.play().catch(() => {
        showMessage("اضغط زر التشغيل لبدء المشاهدة.");
      });

    } else if (isHls && window.Hls && Hls.isSupported()) {
      hlsInstance = new Hls();
      hlsInstance.loadSource(url);
      hlsInstance.attachMedia(player);

      hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
        player.play().catch(() => {
          showMessage("اضغط زر التشغيل لبدء المشاهدة.");
        });
      });

      hlsInstance.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) showMessage("حدث خطأ أثناء تحميل البث.");
      });

    } else {
      player.src = url;
      player.play().catch(() => {
        showMessage("اضغط زر التشغيل لبدء المشاهدة.");
      });
    }

  } catch (error) {
    console.error(error);
    showMessage(error.message || "تعذر تشغيل هذا المصدر.");
  }
}

function shareMatch() {
  if (navigator.share) {
    navigator.share({
      title:document.title,
      url:location.href
    }).catch(() => {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(location.href)
      .then(() => alert("تم نسخ رابط المباراة"));
  } else {
    alert(location.href);
  }
}

loadSources();
</script>
</body>
</html>
